{% include base_path %}

<!-- start custom head snippets -->

<!-- Fonts: Source Serif 4 (headings) and IBM Plex Sans (text) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap">

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon: "cc" monogram in the site violet -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Fix Altmetric badge in dark mode -->
<style>
/* Popover: keep text dark on white background */
[class*="altmetric-popover"] { color: #222 !important; background-color: #fff !important; }
[class*="altmetric-popover"] * { color: #222 !important; }
/* Invert citation graph in dark mode (transparent bg so only elements flip) */
html[data-theme="dark"] img[src*="czymara_scholar_citations"] {
  filter: invert(1);
}
/* Badge donut: force white background so black score number stays readable */
html[data-theme="dark"] .altmetric-embed img,
html[data-theme="dark"] .altmetric-embed a img {
  background-color: #fff !important;
  border-radius: 50%;
}
</style>

<!-- end custom head snippets -->
