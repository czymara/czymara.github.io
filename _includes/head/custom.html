{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Fix Altmetric badge in dark mode -->
<style>
/* Popover: keep text dark on white background */
[class*="altmetric-popover"] { color: #222 !important; background-color: #fff !important; }
[class*="altmetric-popover"] * { color: #222 !important; }
/* Invert citation graph in dark mode (transparent bg so only elements flip) */
html[data-theme="dark"] img[src*="czymara_scholar_citations"] {
  filter: invert(1);
}
/* Google Scholar stats block in the author sidebar */
.scholar-stats-item { list-style: none; padding: 10px 0 0 0; }
.scholar-stats {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  max-width: 200px;
  margin-bottom: 6px;
}
.scholar-stat { flex: 1; text-align: center; line-height: 1.2; }
.scholar-stat-value { display: block; font-size: 1.15em; font-weight: 700; }
.scholar-stat-label { display: block; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.03em; opacity: 0.85; }
.scholar-stat-sub { display: block; font-size: 0.62em; opacity: 0.6; }
.scholar-chart { width: 100%; max-width: 200px; display: block; }
.scholar-caption { font-size: 0.62em; opacity: 0.6; margin: 2px 0 0 0; max-width: 200px; }
/* Badge donut: force white background so black score number stays readable */
html[data-theme="dark"] .altmetric-embed img,
html[data-theme="dark"] .altmetric-embed a img {
  background-color: #fff !important;
  border-radius: 50%;
}
</style>

<!-- end custom head snippets -->
