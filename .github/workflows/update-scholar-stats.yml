name: Update Google Scholar stats

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scholar-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scholarly pyyaml matplotlib

      - name: Fetch Google Scholar stats
        # Being blocked by Scholar is the normal case, not a broken build.
        # continue-on-error keeps the run green so you don't get a failure
        # email four times a day; the step log still shows what happened,
        # and the commit step below simply finds nothing to commit.
        continue-on-error: true
        run: python scripts/fetch_scholar_stats.py

      - name: Commit updated stats (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.yml code/citations/czymara_scholar_citations.png
          if git diff --cached --quiet; then
            echo "No change in citation stats today."
          else
            # No [skip ci] here on purpose: the commit must trigger
            # jekyll.yml so the new numbers actually reach the live site.
            git commit -m "Update Google Scholar stats"
            git pull --rebase origin master
            git push
          fi
